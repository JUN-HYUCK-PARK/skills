name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - name: Check shell syntax
        run: bash -n infra/bin/provision
      - name: Validate the compose catalog
        run: docker compose -f infra/docker-compose.yml --profile '*' config --quiet
      - name: Validate published examples
        run: |
          passed=0
          total=0
          for profile in skills/grove/examples/*.runtime-profile.yml; do
            total=$((total + 1))
            node infra/bin/cli.mjs validate "$profile"
            passed=$((passed + 1))
          done
          echo "profiles ${passed}/${total}"
