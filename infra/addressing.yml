# Addressing for this Ground checkout. Yaml is source of truth; the CLI paints it.
# Clone-specific TLD: addressing.local.yml next to this file (gitignored).
# A consuming project inherits tld when its profile omits addressing.tld.
# Pin a domain in that project repo with addressing.tld, or
# .agents/runtime-profile.local.yml for one clone.
#
# tld: local.example.com  with scheme {service}.{project}.{tld}
#   → web.acme.local.example.com          (*.*.local.example.com)
#   → web--w1.acme.local.example.com      overlay stays two labels (--, not a dot)
#
# TLS certificates cover one label per wildcard. DNS wildcard behavior follows
# different rules; see lib/wildcards.mjs. Local DNS uses explicit project zones.

tld: ground.test
scheme:
  shared: "{service}.{project}.{tld}"
  overlay: "{service}--{env}.{project}.{tld}"
