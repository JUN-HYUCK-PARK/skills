# 머신 공유 인프라 — 이 머신의 모든 프로젝트가 쓰는 엔진들.
# 프로젝트는 여기 있는 엔진을 자기 compose에 다시 띄우지 않는다.
#
# 엔진은 머신에 하나뿐이므로 표준 포트를 그대로 쓴다. 분리는 포트가 아니라
# 엔진 내부 단위(database·계정·프리픽스)로 한다 — infra/README.md 참조.
# 전부 127.0.0.1에만 바인딩한다 — 로컬 개발용 자격증명이므로 밖에 열지 않는다.
#
# 기본(up 만 하면 뜨는 것): mysql8 · pg16 · redis7
# 선택(--profile 로): kafka · mongo · mail · minio
#   docker compose --profile kafka up -d
name: dev-infra

services:
  mysql8:
    image: mysql:8.4
    container_name: dev-mysql8
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql8:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 12

  pg16:
    image: postgres:16
    container_name: dev-pg16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg16:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis7:
    image: redis:7
    container_name: dev-redis7
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis7:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: apache/kafka:3.9.0
    container_name: dev-kafka
    profiles: [kafka]
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # 호스트 클라이언트는 localhost:9092, 같은 dev-infra 네트워크의
      # 컨테이너는 dev-kafka:19092 로 붙는다.
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://dev-kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka:/var/lib/kafka/data
    restart: unless-stopped

  mongo7:
    image: mongo:7
    container_name: dev-mongo7
    profiles: [mongo]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo7:/data/db
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    container_name: dev-mailpit
    profiles: [mail]
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web UI
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: dev-minio
    profiles: [minio]
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio:/data
    restart: unless-stopped

volumes:
  mysql8:
  pg16:
  redis7:
  kafka:
  mongo7:
  minio:

networks:
  # 프로젝트 compose의 컨테이너가 인프라에 붙어야 하면 이 네트워크를
  # external로 참조한다. 호스트 프로세스는 그냥 localhost:<port>.
  default:
    name: dev-infra
