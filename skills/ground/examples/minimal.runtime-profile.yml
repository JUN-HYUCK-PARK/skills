# Example choice: two services on Kubernetes with overlays disabled.
# Use the environment confirmed for the project; these values are illustrative.
version: 1

project:
  slug: sideapp

addressing:
  # tld omitted: inherit the catalog default or machine override.
  scheme:
    shared: "{service}.{project}.{tld}"   # web.sideapp.ground.test
    # no overlay scheme — overlay: none
  ports:
    blocks: { api: 6000, web: 6100 }      # do not overlap other projects' blocks
    registry: README.md

runtime:
  default: development
  single_stack: true
  writers: 1
  profiles:
    development:
      backend: kubernetes
      context: example-local
  commands:
    status: kubectl --context example-local get pods
    up: kubectl --context example-local apply -k deploy/local

services:
  api: { kind: api, port: 6001, health: /health, reflect: restart }
  web: { kind: web, port: 6101, health: /, reflect: source }

overlay: none

data:
  infra: machine              # engines on machine-shared infra — do not start them here
  engines:
    pg: [sideapp]             # created by `de-novo skills setup` from this declaration
    redis: { prefix: "sideapp:" }
  migrate: pnpm run db:migrate
  fixtures: [seed-script]
  forbid_direct_db_writes: true
